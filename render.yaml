services:
  - type: web
    name: ors-explorer
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_DATA_DIR
        value: /data
      - key: ONTOLOGY_FILE
        value: /data/ontology.json
      - key: DEFAULT_QUERY_FILE
        value: /data/query.json
      - key: ALLOW_DELETE
        value: "false"
    disk:
      name: ors-data
      mountPath: /data
      sizeGB: 1