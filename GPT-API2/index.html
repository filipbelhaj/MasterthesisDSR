<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triple Extractor MVP</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    textarea {
      width: 100%;
      min-height: 200px;
      margin-top: 10px;
      padding: 10px;
      font-family: monospace;
      box-sizing: border-box;
    }
    .container { display: grid; gap: 20px; }
    .row { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
    h2 { margin-bottom: 5px; }
    .status { margin-top: 8px; font-size: 14px; }
  </style>
</head>

<body>
  <h1>Ontology Triple Extractor Version 1.0</h1>

  <form id="extract-form">
    <div class="container">
      <div>
        <h2>Input Text</h2>
        <textarea id="input_text" name="input_text" placeholder="Paste regulatory text here"></textarea>
        <button id="generate" type="submit">Generate</button>
        <div id="status" class="status"></div>
      </div>

      <div class="row">
        <div>
          <h2>QuickStatements Output</h2>
          <textarea id="qs_output" readonly></textarea>
        </div>

        <div>
          <h2>Explain / Evidence</h2>
          <textarea id="explain_output" readonly></textarea>
        </div>
      </div>
    </div>
  </form>

  <script>
    const form = document.getElementById('extract-form');
    const input = document.getElementById('input_text');
    const qs = document.getElementById('qs_output');
    const explain = document.getElementById('explain_output');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('generate');

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input_text = (input.value || '').trim();

      if (!input_text) {
        setStatus('Please paste some text first.');
        return;
      }

      btn.disabled = true;
      setStatus('Generating…');
      qs.value = '';
      explain.value = '';

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input_text })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data && data.error ? data.error : 'Request failed');
        }

        qs.value = data.qs_output || '';
        explain.value = data.explain_output || '';
        setStatus('Done.');
      } catch (err) {
        setStatus('Error: ' + (err && err.message ? err.message : String(err)));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
